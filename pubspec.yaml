name: doanmonhoc
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  google_sign_in: ^6.2.1
  flutter:
    sdk: flutter
  intl: ^0.19.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  image_picker: ^1.1.2
  socket_io_client: ^2.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  provider: ^6.1.1
  flutter_lints: ^6.0.0
  shared_preferences: ^2.2.2
flutter:
  uses-material-design: true

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Italic.ttf
          style: italic
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
